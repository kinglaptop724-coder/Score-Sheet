<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบบันทึกคะแนนนักเรียน</title>
<meta name="description" content="ระบบบันทึกคะแนนนักเรียน ใช้งานผ่าน Google Apps Script + Google Sheets">
<meta name="theme-color" content="#3B82F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="บันทึกคะแนน">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--a:#3B82F6;--b:#8B5CF6;--bg:#F8FAFC;--ink:#1E293B;--muted:#64748B}
@media (prefers-color-scheme:dark){:root{--bg:#0B1120;--ink:#F1F5F9;--muted:#94A3B8}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
button{font-family:inherit}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#boot{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;padding:24px;
  background:linear-gradient(135deg,var(--a),var(--b));color:#fff;transition:opacity .35s}
#boot.done{opacity:0;pointer-events:none}
#boot img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 32px rgba(30,27,75,.35)}
#boot h1{margin:0;font-size:1.25rem}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#msg{max-width:360px;font-size:.95rem;line-height:1.6;opacity:.95}
#msg a{color:#fff;font-weight:700}
#boot{z-index:10}
#devbar{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center;
  background:#B45309;color:#fff;font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#devbar a{color:#fff;text-decoration:underline}
#install{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;
  background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-radius:999px;box-shadow:0 6px 20px rgba(30,27,75,.35);overflow:hidden}
#install button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
#installGo{display:flex;align-items:center;gap:8px;padding:9px 6px 9px 14px;font-weight:700;font-size:.86rem}
#installGo img{width:22px;height:22px;border-radius:6px}
#installX{padding:9px 12px 9px 6px;font-size:1rem;opacity:.8}
#sheetBg{position:fixed;inset:0;z-index:20;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:440px;background:var(--bg);color:var(--ink);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media (min-width:600px){#sheetBg{align-items:center}#sheet{border-radius:20px}}
#sheet h2{margin:0 0 4px;font-size:1.1rem;display:flex;align-items:center;gap:10px}
#sheet h2 img{width:36px;height:36px;border-radius:9px}
#sheet p.sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
#sheet ol{margin:0 0 16px;padding-left:22px;line-height:1.9}
#sheet .ic{display:inline-block;padding:0 7px;border:1px solid var(--muted);border-radius:6px;font-size:.9rem;line-height:1.5}
#sheet .row{display:flex;gap:8px}
#sheet .row button{flex:1;border:0;border-radius:12px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
#sheet .pri{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
#sheet .sec{background:rgba(100,116,139,.18);color:var(--ink)}
</style>
</head>
<body>
<iframe id="app" title="ระบบบันทึกคะแนนนักเรียน" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>

<div id="boot" role="status">
  <img src="icons/icon-192.png" alt="">
  <h1 id="name">ระบบบันทึกคะแนนนักเรียน</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">กำลังเปิดระบบ…</p>
</div>

<div id="devbar" hidden><span>โหมดทดสอบ (DEV)</span><a id="devopen" href="#" target="_blank" rel="noopener">เปิดในแท็บใหม่ ↗</a></div>

<div id="install" hidden>
  <button id="installGo" type="button"><img src="icons/icon-192.png" alt=""><span>ติดตั้งแอป</span></button>
  <button id="installX" type="button" aria-label="ซ่อน">✕</button>
</div>

<div id="sheetBg" hidden>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"><img src="icons/icon-192.png" alt=""><span>ติดตั้งแอป</span></h2>
    <p class="sub" id="sheetSub"></p>
    <ol id="sheetSteps"></ol>
    <div class="row"><button class="sec" id="sheetCopy" type="button" hidden>คัดลอกลิงก์</button><button class="pri" id="sheetClose" type="button">เข้าใจแล้ว</button></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  var cfg = window.APP_CONFIG || {};
  var q = new URLSearchParams(location.search);
  var isDev = q.has('dev') && !!String(cfg.DEV_URL || '').trim();   // เปิดเว็บด้วย ?dev เพื่อทดสอบโค้ดที่เพิ่งแก้ใน Apps Script
  var url = String((isDev ? cfg.DEV_URL : cfg.APP_URL) || '').trim();
  var boot = document.getElementById('boot'), msg = document.getElementById('msg');
  var frame = document.getElementById('app'), spin = document.getElementById('spin');
  if (cfg.APP_NAME) { document.title = cfg.APP_NAME; document.getElementById('name').textContent = cfg.APP_NAME; }

  if (!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/(exec|dev)/.test(url)) {
    spin.hidden = true;
    msg.innerHTML = 'ยังไม่ได้ตั้งค่าลิงก์ Apps Script<br>เปิดไฟล์ <b>config.js</b> แล้ววางลิงก์ที่ลงท้ายด้วย <b>/exec</b>';
    return;
  }

  // ส่งต่อ query/hash (เช่น ?v=2) ไปยังเว็บแอป
  // embed=1 บอก Apps Script ว่าเรียกมาจากหน้านี้ (ไม่ต้องพาไปเว็บใหม่ซ้ำ)
  q.delete('dev');
  var rest = q.toString();
  var target = url + (url.indexOf('?') > -1 ? '&' : '?') + 'embed=1' + (rest ? '&' + rest : '') + location.hash;

  if (isDev) {   // ป้ายโหมดทดสอบ + ลิงก์เปิดแท็บใหม่ (หน้า /dev ต้องล็อกอินบัญชีเจ้าของสคริปต์)
    var bar = document.getElementById('devbar');
    document.getElementById('devopen').href = target;
    bar.hidden = false;
  }

  var shown = false;
  function show() { if (shown) return; shown = true; boot.classList.add('done'); setTimeout(function () { boot.hidden = true; }, 400); }
  frame.addEventListener('load', show);
  frame.hidden = false;
  frame.src = target;

  // ถ้าโหลดนาน/ถูกบล็อก ให้ลิงก์สำรอง
  setTimeout(function () {
    if (shown) return;
    msg.innerHTML = (isDev ? 'ลิงก์ /dev ต้องล็อกอินด้วยบัญชีเจ้าของสคริปต์<br>' : '') + 'ใช้เวลานานกว่าปกติ… ถ้าไม่เปิด ให้ <a href="' + target + '" target="_blank" rel="noopener">เปิดในแท็บใหม่</a>';
  }, 8000);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();

/* ---------- ระบบติดตั้งแอป (PWA) ---------- */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var box = $('install'), bg = $('sheetBg');
  var ua = navigator.userAgent || '';
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone) return;                                   // ติดตั้งและเปิดเป็นแอปอยู่แล้ว

  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var inApp = /Line\/|FBAN|FBAV|Instagram|MicroMessenger|Messenger/i.test(ua);   // เบราว์เซอร์ในแอปแชท ติดตั้งไม่ได้
  var KEY = 'pwa_hide_until', deferred = null;

  function hidden() { try { return Number(localStorage.getItem(KEY) || 0) > Date.now(); } catch (e) { return false; } }
  function hideFor(days) { try { localStorage.setItem(KEY, String(Date.now() + days * 864e5)); } catch (e) {} box.hidden = true; }
  function show() { if (!hidden()) box.hidden = false; }

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; show(); });
  window.addEventListener('appinstalled', function () { deferred = null; box.hidden = true; closeSheet(); });

  function sheet(sub, steps, copy) {
    $('sheetSub').textContent = sub;
    $('sheetSteps').innerHTML = steps.map(function (x) { return '<li>' + x + '</li>'; }).join('');
    $('sheetCopy').hidden = !copy;
    bg.hidden = false;
  }
  function closeSheet() { bg.hidden = true; }

  $('installGo').addEventListener('click', function () {
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function (c) { deferred = null; if (c && c.outcome === 'accepted') box.hidden = true; }).catch(function () {});
    } else if (inApp) {
      sheet('เบราว์เซอร์ในแอปแชท (เช่น LINE / Facebook) ติดตั้งแอปไม่ได้ ให้เปิดลิงก์นี้ในเบราว์เซอร์ก่อน', [
        'กดเมนู <span class="ic">⋮</span> หรือ <span class="ic">···</span> มุมขวาบน',
        'เลือก <b>เปิดในเบราว์เซอร์</b> (Chrome / Safari)',
        'จากนั้นกดปุ่ม <b>ติดตั้งแอป</b> อีกครั้ง'
      ], true);
    } else if (isIOS) {
      sheet('ติดตั้งบน iPhone / iPad ผ่าน Safari ทำได้ 3 ขั้นตอน', [
        'กดปุ่มแชร์ <span class="ic">⬆︎</span> ที่แถบล่างของ Safari',
        'เลื่อนลงแล้วเลือก <b>เพิ่มไปยังหน้าจอโฮม</b>',
        'กด <b>เพิ่ม</b> ที่มุมขวาบน'
      ], false);
    } else {
      sheet('ติดตั้งผ่านเมนูของเบราว์เซอร์', [
        'กดเมนู <span class="ic">⋮</span> มุมขวาบนของ Chrome',
        'เลือก <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b>'
      ], false);
    }
  });
  $('installX').addEventListener('click', function () { hideFor(7); });
  $('sheetClose').addEventListener('click', closeSheet);
  bg.addEventListener('click', function (e) { if (e.target === bg) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  $('sheetCopy').addEventListener('click', function () {
    var b = $('sheetCopy'), done = function () { b.textContent = 'คัดลอกแล้ว ✓'; };
    try { navigator.clipboard.writeText(location.href.split('#')[0]).then(done, function () {}); } catch (e) {}
  });

  // iOS Safari และเบราว์เซอร์ในแอปไม่มีเหตุการณ์ beforeinstallprompt จึงแสดงปุ่มพร้อมวิธีติดตั้งแทน
  if (isIOS || inApp) show();
})();
</script>
</body>
</html>
